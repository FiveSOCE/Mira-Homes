name: MiraHomes
version: 0.1.2-1.18.2
main: com.mira.homes.MiraHomesPlugin
api-version: '1.18'
authors: [FiveS]
description: EssentialsX-backed GUI homes for the Mira plugin ecosystem.
depend: [Essentials]
softdepend: [MiraCosmetics]
commands:
  mhomes:
    description: Open the MiraHomes GUI.
    usage: /mhomes
    aliases: [mhome]
    permission: mirahomes.use
permissions:
  mirahomes.use:
    default: true
