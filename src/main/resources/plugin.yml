name: MiraHomes
version: 0.1.0
main: com.mira.homes.MiraHomesPlugin
api-version: '1.21'
authors: [FiveS]
description: EssentialsX-backed GUI homes for the Mira plugin ecosystem.
depend: [Essentials]
commands:
  mhomes:
    description: Open the MiraHomes GUI.
    usage: /mhomes
    aliases: [mhome]
    permission: mirahomes.use
permissions:
  mirahomes.use:
    default: true
